# OpenSC8 Mixer - Fase 0 (gerado; remova este arquivo para desfazer)
# Perfil pro-audio na fifine SC8 (USB 3142:0c88) para expor as duas saídas (Chat e Game).
# O card é identificado pelo vendor/product ID; os nós, pelo nome que o ALSA dá à SC8.
device.profile.priority.rules = [
  {
    matches = [ { device.vendor.id = "0x3142", device.product.id = "0x0c88" } ]
    actions = { update-props = { priorities = [ "pro-audio" ] } }
  }
]

monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.usb-MV-SILICON_fifine_SC8.*pro-output-0" } ]
    actions = { update-props = {
      node.name = "sc8_chat"
      node.description = "SC8 Chat"
      node.nick = "SC8 Chat"
    } }
  }
  {
    matches = [ { node.name = "~alsa_output.usb-MV-SILICON_fifine_SC8.*pro-output-1" } ]
    actions = { update-props = {
      node.name = "sc8_game"
      node.description = "SC8 Game"
      node.nick = "SC8 Game"
    } }
  }
  {
    matches = [ { node.name = "~alsa_input.usb-MV-SILICON_fifine_SC8.*pro-input-0" } ]
    actions = { update-props = {
      node.name = "sc8_mic"
      node.description = "SC8 Mic"
      node.nick = "SC8 Mic"
    } }
  }
]
